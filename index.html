<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Taster | Fichaje de Personal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Librería para lectura de QR con cámara (html5-qrcode) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <!-- Google Fonts: Montserrat & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bt: {
              red: '#C8102E',     // Rojo oficial
              yellow: '#FFC200',  // Amarillo oficial
              darkBg: '#121212',  // Fondo negro
              card: '#1E1E22',    // Tarjetas en gris oscuro
              border: '#2C2C30',  // Bordes sutiles
              textLight: '#F4F4F5'// Texto blanco claro
            }
          },
          fontFamily: {
            title: ['Montserrat', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bt-darkBg text-bt-textLight font-body min-h-screen flex flex-col justify-between p-4 sm:p-6 select-none">

  <!-- Header con el Logo Oficial Global -->
  <header class="w-full max-w-md mx-auto text-center pt-2 flex flex-col items-center">
    <img 
      src="https://i.ibb.co/2XFv715/logo.png" 
      alt="Burger Taster" 
      class="w-32 h-auto object-contain mb-2 drop-shadow-[0_4px_10px_rgba(255,194,0,0.2)]"
      onerror="this.onerror=null; this.src='https://i.ibb.co/3sZq1qW/burger-taster-logo.png';"
    >
    <p class="text-xs font-bold text-bt-yellow tracking-widest uppercase">
      Control de Asistencia
    </p>
  </header>

  <!-- Tarjeta Principal de Fichaje -->
  <main class="w-full max-w-md mx-auto my-auto py-4">
    <div class="bg-bt-card rounded-3xl p-6 shadow-2xl border border-bt-border relative">
      
      <!-- Paso 1: Datos del Empleado -->
      <div class="space-y-4 mb-5">
        <!-- Selector de Sucursal -->
        <div class="bg-bt-darkBg border border-bt-border rounded-2xl p-3">
          <label class="block text-[10px] font-bold text-bt-yellow uppercase tracking-wider mb-1">
            📍 1. Seleccioná tu Sucursal
          </label>
          <select id="sucursal-selector" class="w-full bg-transparent text-sm font-title font-bold text-white focus:outline-none cursor-pointer">
            <option value="Hudson" class="bg-bt-card text-white">Hudson</option>
            <option value="Berazategui - Mitre 498" class="bg-bt-card text-white">Berazategui - Mitre 498</option>
            <option value="Quilmes - Moreno 339" class="bg-bt-card text-white">Quilmes - Moreno 339</option>
            <option value="Quilmes - Av. Calchaquí 3699" class="bg-bt-card text-white">Quilmes - Av. Calchaquí 3699</option>
          </select>
        </div>

        <!-- Ingreso de Nombre y Apellido -->
        <div class="bg-bt-darkBg border border-bt-border rounded-2xl p-3">
          <label class="block text-[10px] font-bold text-bt-yellow uppercase tracking-wider mb-1">
            👤 2. Ingresá tu Nombre y Apellido
          </label>
          <input 
            type="text" 
            id="nombre-input"
            placeholder="Ej: Juan Pérez" 
            class="w-full bg-transparent text-base font-title font-bold text-white placeholder-gray-600 focus:outline-none"
          >
        </div>
      </div>

      <!-- Paso 2: Escáner QR de Confirmación -->
      <div class="relative w-full aspect-square bg-black rounded-2xl border-2 border-bt-border flex flex-col items-center justify-center overflow-hidden mb-5 shadow-inner">
        
        <!-- Elemento donde la cámara se va a renderizar -->
        <div id="reader" class="w-full h-full object-cover"></div>

        <!-- Botón para Iniciar Escaneo -->
        <div id="start-camera-overlay" class="absolute inset-0 bg-black/85 backdrop-blur-xs flex flex-col items-center justify-center p-4 text-center z-10">
          <p class="text-xs text-gray-300 font-medium mb-3">
            Ingresá tu nombre arriba y luego presioná para registrar la entrada.
          </p>
          <button 
            onclick="iniciarEscanerQR()" 
            class="bg-bt-yellow hover:bg-bt-yellow/90 text-black font-title font-bold px-5 py-3 rounded-xl transition active:scale-95 text-xs tracking-wider uppercase shadow-lg flex items-center gap-2"
          >
            📷 Escanear QR para Fichar
          </button>
        </div>

      </div>

      <!-- Mensaje de Resultado del Escaneo -->
      <div id="qr-result" class="hidden mb-4 p-3 rounded-xl text-center text-xs font-bold"></div>

    </div>
  </main>

  <!-- Footer con Créditos y Contacto Directo -->
  <footer class="w-full max-w-md mx-auto text-center py-4 space-y-2">
    <p class="text-xs text-gray-300 font-medium">
      Desarrollado por <span class="text-bt-yellow font-bold">Camila Ferro</span>
    </p>
    <div>
      <a 
        href="mailto:camilaferroit@gmail.com?subject=Consulta%20sobre%20el%20sistema%20de%20fichaje" 
        class="inline-flex items-center gap-1.5 bg-bt-card border border-bt-border hover:border-bt-yellow text-xs text-gray-300 hover:text-bt-yellow px-4 py-1.5 rounded-full transition shadow-sm font-semibold"
      >
        ✉️ Contactar a la desarrolladora
      </a>
    </div>
  </footer>

  <!-- Lógica JavaScript para Cámara y Notificaciones al Grupo de Telegram -->
  <script>
    let html5QrcodeScanner = null;

    // CREDENCIALES DEL GRUPO DE TELEGRAM CONFIGURADAS
    const TELEGRAM_BOT_TOKEN = '9064976341:AAHpVSEN8JYU5Vc41tB5Fg8yMKpQK7_T75w'; 
    const TELEGRAM_CHAT_ID = '-1003869273352';

    function iniciarEscanerQR() {
      const nombreEmpleado = document.getElementById('nombre-input').value.trim();

      if (!nombreEmpleado) {
        alert("⚠️ Por favor, ingresá tu nombre y apellido antes de escanear el código QR.");
        return;
      }

      const overlay = document.getElementById('start-camera-overlay');
      if (overlay) overlay.style.display = 'none';

      html5QrcodeScanner = new Html5Qrcode("reader");

      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess, 
        onScanError
      ).catch(err => {
        console.error("Error al iniciar cámara: ", err);
        alert("No se pudo acceder a la cámara. Verificá los permisos de tu navegador.");
        if (overlay) overlay.style.display = 'flex';
      });
    }

    function onScanSuccess(decodedText, decodedResult) {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('start-camera-overlay').style.display = 'flex';
        }).catch(err => console.error(err));
      }

      const nombreEmpleado = document.getElementById('nombre-input').value.trim();
      const sucursal = document.getElementById('sucursal-selector').value;
      const ahora = new Date().toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' });

      // Mensaje en pantalla
      const resultDiv = document.getElementById('qr-result');
      resultDiv.className = "mb-4 p-3 rounded-xl text-center text-xs font-bold bg-green-500/20 text-green-400 border border-green-500/40 block";
      resultDiv.innerText = `✅ ¡Fichaje Exitoso, ${nombreEmpleado}! (${sucursal})`;

      // Enviar notificación al Grupo de Telegram
      enviarNotificacionTelegram(nombreEmpleado, sucursal, ahora, decodedText);

      // Limpiar campo de nombre para el próximo fichaje
      document.getElementById('nombre-input').value = '';
    }

    function onScanError(errorMessage) {}

    // Función para enviar mensaje al grupo de Telegram
    function enviarNotificacionTelegram(nombre, sucursal, fechaHora, qrData) {
      const mensaje = `⏱ *NUEVO FICHAJE - BURGER TASTER*\n\n` +
                      `👤 *Empleado/a:* *${nombre}*\n` +
                      `📍 *Sucursal:* ${sucursal}\n` +
                      `📅 *Fecha y Hora:* ${fechaHora}\n` +
                      `🔍 *Validación QR:* ${qrData}`;

      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: mensaje,
          parse_mode: 'Markdown'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          console.log("Fichaje enviado con éxito a Telegram.");
        } else {
          console.error("Error Telegram:", data);
          alert("⚠️ El fichaje se registró localmente, pero Telegram rechazó el envío. Revisá los permisos del bot.");
        }
      })
      .catch(err => console.error("Error de red al notificar:", err));
    }
  </script>

</body>
</html>
